    function App() {
      const [activeTab, setActiveTab] = useState('tasks');
      const [masterViewMode, setMasterViewMode] = useState('grid');
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [workers, setWorkers] = useState(INITIAL_WORKERS);
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [inventory, setInventory] = useState(INITIAL_INVENTORY);

      // Filters state for Tasks
      const [selectedWorker, setSelectedWorker] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');
      
      // Modal State for New Work Order
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newTask, setNewTask] = useState({
        slipNo: '',
        workerName: 'Kailash Ji',
        description: 'Standard 6m Royal Kesariya',
        piecesReceived: '',
        ratePerPc: '',
        paidAmount: '',
        notes: ''
      });

      // Dedicated Material Sub-Slip State inside Modal
      const [materialSubSlip, setMaterialSubSlip] = useState([]);
      const [currentMatInput, setCurrentMatInput] = useState({
        materialId: 'RM-01',
        measureType: 'Length',
        qty: ''
      });

      // Modal State for Manual Stock Add/Restock
      const [isRestockModalOpen, setIsRestockModalOpen] = useState(false);
      const [restockData, setRestockData] = useState({
        materialId: 'RM-01',
        addQty: ''
      });

      // Mobile menu toggle
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Calculated KPI Summaries
      const metrics = useMemo(() => {
        let totalPieces = 0;
        let totalPayable = 0;
        let totalPaid = 0;

        tasks.forEach(task => {
          totalPieces += Number(task.piecesReceived || 0);
          totalPayable += Number(task.totalAmount || 0);
          totalPaid += Number(task.paidAmount || 0);
        });

        const balanceOutstanding = totalPayable - totalPaid;
        const lowStockCount = inventory.filter(item => item.stock <= item.minAlert).length;

        return {
          totalPieces,
          totalPayable,
          totalPaid,
          balanceOutstanding,
          lowStockCount
        };
      }, [tasks, inventory]);

      // Filtered Tasks
      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesWorker = selectedWorker === 'All' || task.workerName === selectedWorker;
          const matchesStatus = selectedStatus === 'All' || task.status === selectedStatus;
          const matchesSearch = 
            task.slipNo.toLowerCase().includes(searchTerm.toLowerCase()) ||
            task.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
            task.workerName.toLowerCase().includes(searchTerm.toLowerCase());
          
          return matchesWorker && matchesStatus && matchesSearch;
        });
      }, [tasks, selectedWorker, selectedStatus, searchTerm]);

      // Worker wise aggregations for summary
      const workerSummary = useMemo(() => {
        const summaryMap = {};

        workers.forEach(w => {
          summaryMap[w.name] = {
            name: w.name,
            role: w.role,
            totalTasks: 0,
            totalPieces: 0,
            totalEarned: 0,
            totalPaid: 0,
            balance: 0,
            materialConsumed: 0
          };
        });

        tasks.forEach(task => {
          if (!summaryMap[task.workerName]) {
            summaryMap[task.workerName] = {
              name: task.workerName,
              role: 'Artisan',
              totalTasks: 0,
              totalPieces: 0,
              totalEarned: 0,
              totalPaid: 0,
              balance: 0,
              materialConsumed: 0
            };
          }
          const w = summaryMap[task.workerName];
          w.totalTasks += 1;
          w.totalPieces += Number(task.piecesReceived || 0);
          w.totalEarned += Number(task.totalAmount || 0);
          w.totalPaid += Number(task.paidAmount || 0);
          w.balance = w.totalEarned - w.totalPaid;

          if (task.subSlipMaterials && task.subSlipMaterials.length > 0) {
            task.subSlipMaterials.forEach(m => {
              w.materialConsumed += Number(m.qty || 0);
            });
          }
        });

        return Object.values(summaryMap);
      }, [workers, tasks]);

      // Add item to material sub-slip
      const handleAddSubSlipItem = () => {
        if (!currentMatInput.qty || Number(currentMatInput.qty) <= 0) return;
        
        const matObj = inventory.find(i => i.id === currentMatInput.materialId);
        if (!matObj) return;

        const unitLabel = currentMatInput.measureType === 'Length' ? 'Meters' : currentMatInput.measureType === 'Weight' ? 'Kg' : matObj.unit;

        const newItem = {
          id: matObj.id,
          name: matObj.name,
          qty: Number(currentMatInput.qty),
          unit: unitLabel,
          type: currentMatInput.measureType
        };

        setMaterialSubSlip([...materialSubSlip, newItem]);
        setCurrentMatInput({ ...currentMatInput, qty: '' });
      };

      const handleRemoveSubSlipItem = (index) => {
        setMaterialSubSlip(materialSubSlip.filter((_, i) => i !== index));
      };

      // Handle Create New Task Submission with Automatic Multi-Material Sub-Slip Inventory Deduction
      const handleAddTaskSubmit = (e) => {
        e.preventDefault();
        if (!newTask.slipNo || !newTask.piecesReceived || !newTask.ratePerPc) {
          return;
        }

        const pieces = Number(newTask.piecesReceived);
        const rate = Number(newTask.ratePerPc);
        const total = pieces * rate;
        const paid = Number(newTask.paidAmount || 0);

        // Deduct raw materials listed in sub-slip from active inventory
        if (materialSubSlip.length > 0) {
          setInventory(prevInv => 
            prevInv.map(item => {
              const subItemMatches = materialSubSlip.filter(m => m.id === item.id);
              if (subItemMatches.length > 0) {
                const totalDeduction = subItemMatches.reduce((acc, curr) => acc + curr.qty, 0);
                return { ...item, stock: Math.max(0, item.stock - totalDeduction) };
              }
              return item;
            })
          );
        }

        let status = 'Pending';
        if (paid >= total) {
          status = 'Paid';
        } else if (paid > 0) {
          status = 'Partial';
        }

        const subSlipSummary = materialSubSlip.length > 0
          ? materialSubSlip.map(m => `${m.name} (${m.qty} ${m.unit})`).join(', ')
          : 'No material issued';

        const createdTask = {
          id: `TSK-${Date.now()}`,
          slipNo: newTask.slipNo.toUpperCase(),
          workerId: workers.find(w => w.name === newTask.workerName)?.id || 'W-999',
          workerName: newTask.workerName,
          date: new Date().toISOString().split('T')[0],
          description: newTask.description,
          piecesReceived: pieces,
          ratePerPc: rate,
          totalAmount: total,
          paidAmount: paid,
          status: status,
          subSlipMaterials: materialSubSlip,
          materialAllocated: subSlipSummary,
          notes: newTask.notes || 'Newly logged work order with material sub-slip'
        };

        setTasks([createdTask, ...tasks]);
        setIsModalOpen(false);
        setMaterialSubSlip([]);
        setNewTask({
          slipNo: '',
          workerName: 'Kailash Ji',
          description: 'Standard 6m Royal Kesariya',
          piecesReceived: '',
          ratePerPc: '',
          paidAmount: '',
          notes: ''
        });
      };

      // Handle Manual Stock Addition
      const handleRestockSubmit = (e) => {
        e.preventDefault();
        if (!restockData.addQty || Number(restockData.addQty) <= 0) return;

        const qtyToAdd = Number(restockData.addQty);
        setInventory(prev => prev.map(item => {
          if (item.id === restockData.materialId) {
            return { ...item, stock: item.stock + qtyToAdd };
          }
          return item;
        }));

        setIsRestockModalOpen(false);
        setRestockData({ materialId: 'RM-01', addQty: '' });
      };

      return (

                <nav className="hidden md:flex space-x-1 bg-amber-950/40 p-1.5 rounded-xl border border-amber-700/40">

                    onClick={() => setActiveTab('tasks')}
                    className={`flex items-center space-x-2 px-3.5 py-2 rounded-lg text-sm font-semibold transition-all duration-200 ${
                      activeTab === 'tasks'
                        ? 'bg-amber-500 text-amber-950 shadow-md'

                    }`}
                  >
                    <i data-lucide="clipboard-list" className="w-4 h-4"></i>
                    <span>Task Ledger</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('inventory')}

                    <p className="text-xs text-amber-200/80 mt-1 max-w-2xl">
                      Automated aggregation of fabric issued vs finished pagdis produced by Kailash Ji, Himmat Ji, Kishore Ji, Amit Sen, and Varsha.
                    </p>
                  </div>
                  <div className="absolute right-4 -bottom-6 text-amber-500/10 opacity-40">
                    <i data-lucide="trending-up" className="w-48 h-48"></i>
                  </div>
                </div>

                {/* Worker Breakdown Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {workerSummary.map((summary) => {
                    const payoutPercentage = summary.totalEarned > 0 
                      ? Math.round((summary.totalPaid / summary.totalEarned) * 100) 
                      : 0;

                    return (
                      <div key={summary.name} className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between">
                            <div>
                              <h4 className="font-bold text-slate-900 text-base">{summary.name}</h4>
                              <span className="text-xs text-slate-400">{summary.role}</span>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-amber-50 border border-amber-200 flex items-center justify-center font-bold text-amber-800">
                              {summary.name.charAt(0)}
                            </div>
                          </div>

                          <div className="mt-4 grid grid-cols-2 gap-2 text-xs">
                            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                              <span className="text-slate-400 block text-[10px]">Total Work Slips</span>
                              <span className="font-bold text-slate-800 text-sm">{summary.totalTasks} slips</span>
                            </div>
                            <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                              <span className="text-slate-400 block text-[10px]">Finished Output</span>
                              <span className="font-bold text-slate-800 text-sm">{summary.totalPieces} pcs</span>
                            </div>
                            <div className="bg-amber-50/50 p-2.5 rounded-xl border border-amber-100 col-span-2">
                              <span className="text-amber-800/70 block text-[10px] font-semibold">Total Issued Raw Material</span>
                              <span className="font-bold text-amber-950 text-sm">{summary.materialConsumed.toLocaleString()} Units</span>
                            </div>
                          </div>

                          {/* Financial Bar */}
                          <div className="mt-4 space-y-1.5">
                            <div className="flex justify-between text-xs">
                              <span className="text-slate-500 font-medium">Payout Clearance</span>
                              <span className="font-bold text-slate-700">{payoutPercentage}%</span>
                            </div>
                            <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                              <div 
                                className="bg-emerald-500 h-full rounded-full transition-all duration-500" 
                                style={{ width: `${payoutPercentage}%` }}
                              />
                            </div>
                          </div>
                        </div>

                        <div className="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                          <div>
                            <span className="text-slate-400 block text-[10px]">Total Labor Value</span>
                            <span className="font-bold text-slate-900">₹{summary.totalEarned.toLocaleString()}</span>
                          </div>
                          <div className="text-right">
                            <span className="text-slate-400 block text-[10px]">Pending Balance</span>
                            <span className={`font-bold ${summary.balance > 0 ? 'text-rose-600' : 'text-emerald-600'}`}>
                              ₹{summary.balance.toLocaleString()}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

              </div>
            )}

          </main>

          {/* --- ADD NEW WORK ORDER & MATERIAL SLIP MODAL WITH MATERIAL SUB-SLIP --- */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 my-8 animate-in fade-in zoom-in duration-200">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="file-spreadsheet" className="w-5 h-5 text-amber-600"></i>
                    <div>
                      <h3 className="text-lg font-bold text-slate-900">Issue Work Order Slip</h3>
                      <p className="text-xs text-slate-500">Log artisan task & issue material sub-slip</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setIsModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 p-1 rounded-lg"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleAddTaskSubmit} className="mt-4 space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Slip No *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. A153"
                        value={newTask.slipNo}
                        onChange={(e) => setNewTask({ ...newTask, slipNo: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Assign Worker *</label>
                      <select
                        value={newTask.workerName}
                        onChange={(e) => setNewTask({ ...newTask, workerName: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                      >
                        {workers.map(w => (
                          <option key={w.id} value={w.name}>{w.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Pagdi Specification *</label>
                    <select
                      value={newTask.description}
                      onChange={(e) => {
                        const selectedProd = products.find(p => p.name === e.target.value);
                        setNewTask({ 
                          ...newTask, 
                          description: e.target.value,
                          ratePerPc: selectedProd ? selectedProd.defaultRate : newTask.ratePerPc
                        });
                      }}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    >
                      {products.map(p => (
                        <option key={p.id} value={p.name}>{p.name} ({p.clothLength})</option>
                      ))}
                    </select>
                  </div>

                  {/* --- DEDICATED MATERIAL SUB-SLIP PANEL --- */}
                  <div className="p-4 bg-amber-50/60 rounded-xl border border-amber-200 space-y-3">
                    <div className="flex items-center justify-between border-b border-amber-200/70 pb-2">
                      <span className="text-xs font-bold text-amber-900 flex items-center">
                        <i data-lucide="scissors" className="w-4 h-4 mr-1.5 text-amber-700"></i> 
                        Raw Material Issuance Sub-Slip
                      </span>
                      <span className="text-[11px] font-semibold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full">
                        {materialSubSlip.length} Items Listed
                      </span>
                    </div>

                    {/* Sub-Slip Entry Inputs */}
                    <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end">
                      {/* Dropdown Material Selection */}
                      <div className="sm:col-span-5">
                        <label className="block text-[11px] font-bold text-slate-700 mb-1">Select Material</label>
                        <select
                          value={currentMatInput.materialId}
                          onChange={(e) => {
                            const sel = inventory.find(i => i.id === e.target.value);
                            const defaultType = sel?.unit === 'Kg' ? 'Weight' : 'Length';
                            setCurrentMatInput({ ...currentMatInput, materialId: e.target.value, measureType: defaultType });
                          }}
                          className="w-full px-2.5 py-1.5 bg-white rounded-lg border border-slate-200 text-xs focus:outline-none focus:ring-1 focus:ring-amber-500"
                        >
                          {inventory.map(inv => (
                            <option key={inv.id} value={inv.id}>
                              {inv.name} (In stock: {inv.stock} {inv.unit})
                            </option>
                          ))}
                        </select>
                      </div>

                      {/* Unit Mode Toggle (Length vs Weight) */}
                      <div className="sm:col-span-3">
                        <label className="block text-[11px] font-bold text-slate-700 mb-1">Unit Type</label>
                        <select
                          value={currentMatInput.measureType}
                          onChange={(e) => setCurrentMatInput({ ...currentMatInput, measureType: e.target.value })}
                          className="w-full px-2.5 py-1.5 bg-white rounded-lg border border-slate-200 text-xs focus:outline-none"
                        >
                          <option value="Length">Length (Meters)</option>
                          <option value="Weight">Weight (Kg)</option>
                          <option value="Pieces">Count (Pcs)</option>
                        </select>
                      </div>

                      {/* Quantity Input */}
                      <div className="sm:col-span-2">
                        <label className="block text-[11px] font-bold text-slate-700 mb-1">Qty</label>
                        <input
                          type="number"
                          min="0.1"
                          step="any"
                          placeholder="e.g. 50"
                          value={currentMatInput.qty}
                          onChange={(e) => setCurrentMatInput({ ...currentMatInput, qty: e.target.value })}
                          className="w-full px-2.5 py-1.5 bg-white rounded-lg border border-slate-200 text-xs focus:outline-none"
                        />
                      </div>

                      {/* Add button */}
                      <div className="sm:col-span-2">
                        <button
                          type="button"
                          onClick={handleAddSubSlipItem}
                          className="w-full py-1.5 bg-amber-700 hover:bg-amber-800 text-white rounded-lg text-xs font-bold shadow-sm transition"
                        >
                          + Add
                        </button>
                      </div>
                    </div>

                    {/* Sub-Slip Issued List */}
                    {materialSubSlip.length > 0 ? (
                      <div className="mt-2 space-y-1.5 max-h-32 overflow-y-auto pr-1">
                        {materialSubSlip.map((item, idx) => (
                          <div key={idx} className="flex items-center justify-between bg-white p-2 rounded-lg border border-amber-200 text-xs">
                            <div className="flex items-center space-x-2">
                              <span className="font-bold text-slate-800">{item.name}</span>
                              <span className="text-[10px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-600 font-mono">
                                {item.type}
                              </span>
                            </div>
                            <div className="flex items-center space-x-2">
                              <span className="font-extrabold text-amber-900">{item.qty} {item.unit}</span>
                              <button
                                type="button"
                                onClick={() => handleRemoveSubSlipItem(idx)}
                                className="text-rose-500 hover:text-rose-700 font-bold p-0.5"
                              >
                                <i data-lucide="x" className="w-3.5 h-3.5"></i>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <p className="text-[11px] text-amber-800/70 italic text-center py-1">
                        No sub-slip raw material items added yet. Use dropdown above to select & specify meters or kg.
                      </p>
                    )}
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Pieces Ordered *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 50"
                        value={newTask.piecesReceived}
                        onChange={(e) => setNewTask({ ...newTask, piecesReceived: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Stitch Rate / Pc (₹) *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        placeholder="e.g. 35"
                        value={newTask.ratePerPc}
                        onChange={(e) => setNewTask({ ...newTask, ratePerPc: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Advance Paid (₹)</label>
                      <input
                        type="number"
                        min="0"
                        placeholder="0"
                        value={newTask.paidAmount}
                        onChange={(e) => setNewTask({ ...newTask, paidAmount: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                      />
                    </div>

                    <div className="flex flex-col justify-end">
                      <div className="p-2.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-700 text-right">
                        Total Labor: ₹
                        {(Number(newTask.piecesReceived || 0) * Number(newTask.ratePerPc || 0)).toLocaleString()}
                      </div>
                    </div>
                  </div>

                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-sm font-semibold bg-amber-600 hover:bg-amber-700 text-white rounded-xl shadow-md transition"
                    >
                      Confirm & Issue Slip
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- RESTOCK MATERIAL MODAL --- */}
          {isRestockModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in zoom-in duration-200">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <i data-lucide="refresh-cw" className="w-5 h-5 text-emerald-600"></i>
                    <h3 className="text-lg font-bold text-slate-900">Restock Raw Material</h3>
                  </div>
                  <button 
                    onClick={() => setIsRestockModalOpen(false)}
                    className="text-slate-400 hover:text-slate-600 p-1 rounded-lg"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleRestockSubmit} className="mt-4 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Select Raw Material *</label>
                    <select
                      value={restockData.materialId}
                      onChange={(e) => setRestockData({ ...restockData, materialId: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    >
                      {inventory.map(item => (
                        <option key={item.id} value={item.id}>
                          {item.name} (Current: {item.stock} {item.unit})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Quantity to Add *</label>
                    <input
                      type="number"
                      min="1"
                      required
                      placeholder="e.g. 500"
                      value={restockData.addQty}
                      onChange={(e) => setRestockData({ ...restockData, addQty: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>

                  <div className="pt-4 flex items-center justify-end space-x-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsRestockModalOpen(false)}
                      className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow-md transition"
                    >
                      Add to Inventory
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* --- FOOTER --- */}
          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div>
                <strong>Shahi Taj Automated ERP Portal</strong> • Proof of Concept Demo
              </div>
              <div className="text-slate-400">
                Raw Material Deductions & Tabular Master Reference Enabled
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render App into DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
