<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahi Taj - ERP & Master Management Portal</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Fuse.js Fuzzy Search Library -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // --- CONFIGURE SUPABASE CREDENTIALS HERE ---
    const SUPABASE_URL = 'https://iusblrlthsmmxsyxwyss.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_5FXaUCAeEf0nbS-I1NkSew_1ae-lKZ6';
    
    const supabase = (SUPABASE_URL !== 'YOUR_SUPABASE_URL_HERE') 
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
        : null;

    // Helper for SHA-256 password hashing
    async function hashPassword(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function App() {
      // --- OPENAI DEMO KEY PLACEHOLDER ---
      const OPENAI_API_KEY = '';
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const speechRecognizer = SpeechRecognition ? new SpeechRecognition() : null;
      if (speechRecognizer) {
        speechRecognizer.lang = 'hi-IN';
        speechRecognizer.continuous = false;
        speechRecognizer.interimResults = false;
      }
      
      // Function to record microphone audio and transcribe via OpenAI Whisper API
      const handleWhisperVoiceInput = async () => {
        if (!OPENAI_API_KEY || OPENAI_API_KEY === 'YOUR_OPENAI_API_KEY_HERE') {
          alert('Please insert your OpenAI API key in the OPENAI_API_KEY variable first.');
          return;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mediaRecorder = new MediaRecorder(stream);
          let audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              audioChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const audioFile = new File([audioBlob], 'voice_prompt.webm', { type: 'audio/webm' });

            const formData = new FormData();
            formData.append('file', audioFile);
            formData.append('model', 'whisper-1');

            setNlQuery('Transcribing audio with Whisper...');

            try {
              const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${OPENAI_API_KEY}`
                },
                body: formData
              });

              const data = await response.json();
              if (data.text) {
                setNlQuery(data.text);
                handleNlQuerySubmit(data.text);
              } else {
                setNlQuery('');
                alert('Transcription failed: ' + (data.error?.message || 'Unknown error'));
              }
            } catch (err) {
              console.error('Whisper API Error:', err);
              setNlQuery('');
              alert('Network error while connecting to Whisper API.');
            }

            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          setNlQuery('Listening... Speak now (Marwari/Hindi/English)');

          setTimeout(() => {
            if (mediaRecorder.state === 'recording') {
              mediaRecorder.stop();
            }
          }, 5000);

        } catch (err) {
          console.error('Microphone access denied or not supported:', err);
          alert('Could not access microphone. Please check browser permissions.');
        }
      };
        
      const [activeTab, setActiveTab] = useState('tasks');
      
      // Authentication & RBAC State
      const [users, setUsers] = useState([]);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');

      // View Switchers for Product & Worker Masters
      const [masterViewMode, setMasterViewMode] = useState('grid');
      const [workerViewMode, setWorkerViewMode] = useState('grid');

      // State Initializations without localStorage or mock fallbacks
      const [tasks, setTasks] = useState([]);
      const [taskProgressBatches, setTaskProgressBatches] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [products, setProducts] = useState([]);
      const [workers, setWorkers] = useState([]);
      const [workerSkills, setWorkerSkills] = useState([]);
      const [workerRates, setWorkerRates] = useState([]);

      // Work Slip Lifecycle Modal State
      const [isProgressModalOpen, setIsProgressModalOpen] = useState(false);
      const [activeTaskToUpdate, setActiveTaskToUpdate] = useState(null);
      const [progressUpdateForm, setProgressUpdateForm] = useState({ piecesChunk: '', newStatus: 'In Progress', paidIncrement: '', notes: '' });

      // Admin Edit Slip Modal State
      const [isEditSlipModalOpen, setIsEditSlipModalOpen] = useState(false);
      const [activeTaskToEdit, setActiveTaskToEdit] = useState(null);
      const [editSlipForm, setEditSlipForm] = useState({ slipNo: '', piecesReceived: '', ratePerPc: '', paidAmount: '', status: 'Pending', notes: '' });

      // Speech Recognition State
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);

      // Natural Language Assistant & Test Drawer States
      const [nlQuery, setNlQuery] = useState('');
      const [nlResponse, setNlResponse] = useState(null);
      const [showTestTools, setShowTestTools] = useState(false);
      const [showJsonInspector, setShowJsonInspector] = useState(false);

      // Heatmap Workload Filter State
      const [heatmapFilter, setHeatmapFilter] = useState('All');

      // Task Filters
      const [selectedWorker, setSelectedWorker] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');

      // Lock worker filter if logged in as Worker
      useEffect(() => {
        if (currentUser && currentUser.role === 'Worker') {
          const wObj = workers.find(w => w.id === currentUser.worker_id);
          if (wObj) {
            setSelectedWorker(wObj.name);
          }
          setActiveTab('tasks');
        }
      }, [currentUser, workers]);

      // Modal States
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newTask, setNewTask] = useState({ slipNo: '', productId: '', workerId: '', piecesReceived: '', ratePerPc: '150', paidAmount: '', notes: '' });
      const [materialSubSlip, setMaterialSubSlip] = useState([]);
      const [currentMatInput, setCurrentMatInput] = useState({ materialId: '', measureType: 'Length', qty: '' });

      const [isRestockModalOpen, setIsRestockModalOpen] = useState(false);
      const [restockData, setRestockData] = useState({ materialId: '', addQty: '' });

      // Product Add/Edit Modal State
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [productForm, setProductForm] = useState({ id: '', name: '', category: 'Traditional', clothLength: '6 Mtr', clothType: 'Cotton', color: '', defaultRate: 150, mrp: 750, description: '' });

      // Worker Add/Edit Modal State
      const [isWorkerModalOpen, setIsWorkerModalOpen] = useState(false);
      const [workerForm, setWorkerForm] = useState({ id: '', name: '', role: 'Artisan', phone: '', skillLevel: 'Master Artisan', monthlyCapacity: 75, selectedProductIds: [], customRatesMap: {} });

      // Safe Delete Confirmation Warning Modal
      const [deleteWarning, setDeleteWarning] = useState({ isOpen: false, title: '', message: '', onConfirm: null });

      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      // Initialize Web Speech Recognition API
      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            setNlQuery(transcript);
            setIsListening(false);
            handleNlQuerySubmit(transcript);
          };

          recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            setIsListening(false);
          };

          recognition.onend = () => {
            setIsListening(false);
          };

          recognitionRef.current = recognition;
        }
      }, []);

      const toggleAudioListening = () => {
        if (!recognitionRef.current) {
          alert('Voice input is not supported in this browser. Try Google Chrome or Safari.');
          return;
        }

        if (isListening) {
          recognitionRef.current.stop();
          setIsListening(false);
        } else {
          setIsListening(true);
          recognitionRef.current.start();
        }
      };

      // Fetch from Supabase exclusively
      useEffect(() => {
        if (supabase) {
          async function fetchSupabaseData() {
            try {
              const [{ data: t }, { data: b }, { data: i }, { data: p }, { data: w }, { data: s }, { data: r }, { data: u }] = await Promise.all([
                supabase.from('tasks').select('*'),
                supabase.from('task_progress_batches').select('*'),
                supabase.from('inventory').select('*'),
                supabase.from('products').select('*'),
                supabase.from('workers').select('*'),
                supabase.from('worker_skills').select('*'),
                supabase.from('worker_product_rates').select('*'),
                supabase.from('users').select('*')
              ]);

              if (t) setTasks(t.map(item => ({ id: item.id, slipNo: item.slip_no, workerId: item.worker_id, workerName: item.worker_name, productId: item.product_id, date: item.date, description: item.description, piecesReceived: Number(item.pieces_received), ratePerPc: Number(item.rate_per_pc), totalAmount: Number(item.total_amount), paidAmount: Number(item.paid_amount), status: item.status, subSlipMaterials: item.sub_slip_materials || [], materialAllocated: item.material_allocated, notes: item.notes })));
              if (b) setTaskProgressBatches(b.map(item => ({ id: item.id, task_id: item.task_id, pieces_completed: Number(item.pieces_completed), created_at: item.created_at, notes: item.notes })));
              if (i) {
                setInventory(i.map(item => ({ id: item.id, name: item.name, unit: item.unit, stock: Number(item.stock), minAlert: Number(item.min_alert), category: item.category })));
                if (i.length > 0) {
                  setCurrentMatInput(prev => ({ ...prev, materialId: i[0].id }));
                  setRestockData(prev => ({ ...prev, materialId: i[0].id }));
                }
              }
              if (p) {
                setProducts(p.map(item => ({ id: item.id, name: item.name, category: item.category, clothLength: item.cloth_length, clothType: item.cloth_type, color: item.color, defaultRate: Number(item.standard_rate), mrp: Number(item.mrp), description: item.description })));
                if (p.length > 0) {
                  setNewTask(prev => ({ ...prev, productId: p[0].id, ratePerPc: p[0].standard_rate || 150 }));
                }
              }
              if (w) {
                setWorkers(w.map(item => ({ id: item.id, name: item.name, role: item.role, phone: item.phone, skillLevel: item.skill_level, monthlyCapacity: Number(item.monthly_capacity || 75) })));
                if (w.length > 0) {
                  setNewTask(prev => ({ ...prev, workerId: w[0].id }));
                }
              }
              if (s) setWorkerSkills(s);
              if (r) setWorkerRates(r);
              if (u) setUsers(u);
            } catch (err) { console.error('Error fetching Supabase:', err); }
          }
          fetchSupabaseData();
        }
      }, []);

      // LOGIN HANDLER
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        const uname = loginForm.username.trim().toLowerCase();
        const pwd = loginForm.password;
        
        const hashedInput = await hashPassword(pwd);
        let foundUser = null;

        if (supabase) {
          try {
            const { data } = await supabase.from('users').select('*');
            if (data && data.length > 0) {
              const matchedRow = data.find(u => u.username.toLowerCase() === uname);
              if (matchedRow) {
                if (matchedRow.password_hash === hashedInput || matchedRow.password_hash === pwd) {
                  foundUser = matchedRow;
                }
              }
            }
          } catch (err) {
            console.error('Supabase login error:', err);
          }
        }

        if (!foundUser && users && users.length > 0) {
          foundUser = users.find(u => u.username.toLowerCase() === uname && (u.password_hash === hashedInput || u.password_hash === pwd));
        }

        if (foundUser) {
          setCurrentUser({
            id: foundUser.id,
            username: foundUser.username,
            role: foundUser.role,
            worker_id: foundUser.worker_id
          });
          setLoginForm({ username: '', password: '' });
          setLoginError('');
        } else {
          setLoginError('Invalid username or password.');
        }
      }; 

      const handleLogout = () => {
        setCurrentUser(null);
      };

      // PRODUCT CRUD HANDLERS
      const handleOpenAddProduct = () => {
        setProductForm({ id: `PRD-0${products.length + 1}`, name: '', category: 'Traditional', clothLength: '6 Mtr', clothType: 'Cotton Base', color: 'Kesariya', defaultRate: 150, mrp: 750, description: '' });
        setIsProductModalOpen(true);
      };

      const handleOpenEditProduct = (prod) => {
        setProductForm({ ...prod });
        setIsProductModalOpen(true);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        const exists = products.find(p => p.id === productForm.id);

        if (supabase) {
          const payload = { id: productForm.id, name: productForm.name, category: productForm.category, cloth_length: productForm.clothLength, cloth_type: productForm.clothType, color: productForm.color, standard_rate: Number(productForm.defaultRate), mrp: Number(productForm.mrp), description: productForm.description };
          if (exists) await supabase.from('products').update(payload).eq('id', productForm.id);
          else await supabase.from('products').insert([payload]);
        }

        const updatedProdObj = { ...productForm, defaultRate: Number(productForm.defaultRate), mrp: Number(productForm.mrp) };
        if (exists) setProducts(products.map(p => p.id === productForm.id ? updatedProdObj : p));
        else setProducts([...products, updatedProdObj]);
        
        setIsProductModalOpen(false);
      };

      const handleDeleteProductConfirm = (prodId) => {
        const prod = products.find(p => p.id === prodId);
        setDeleteWarning({
          isOpen: true,
          title: `Delete Product Master "${prod?.name}"?`,
          message: `Are you sure you want to delete ${prod?.id}? This will clean up associated worker skills and custom negotiated rates.`,
          onConfirm: async () => {
            if (supabase) {
              await supabase.from('products').delete().eq('id', prodId);
            }
            setProducts(products.filter(p => p.id !== prodId));
            setWorkerSkills(workerSkills.filter(s => s.product_id !== prodId));
            setWorkerRates(workerRates.filter(r => r.product_id !== prodId));
            setDeleteWarning({ isOpen: false, title: '', message: '', onConfirm: null });
          }
        });
      };

      // WORKER & CUSTOM RATES CRUD HANDLERS
      const handleOpenAddWorker = () => {
        setWorkerForm({ id: `WKR-0${workers.length + 1}`, name: '', role: 'Artisan Specialist', phone: '+91 98000 00000', skillLevel: 'Senior Specialist', monthlyCapacity: 75, selectedProductIds: [], customRatesMap: {} });
        setIsWorkerModalOpen(true);
      };

      const handleOpenEditWorker = (wrk) => {
        const mappedProdIds = workerSkills.filter(s => s.worker_id === wrk.id).map(s => s.product_id);
        const ratesMap = {};
        workerRates.filter(r => r.worker_id === wrk.id).forEach(r => { ratesMap[r.product_id] = r.custom_rate; });
        setWorkerForm({ ...wrk, monthlyCapacity: wrk.monthlyCapacity || 75, selectedProductIds: mappedProdIds, customRatesMap: ratesMap });
        setIsWorkerModalOpen(true);
      };

      const handleSaveWorker = async (e) => {
        e.preventDefault();
        const exists = workers.find(w => w.id === workerForm.id);

        if (supabase) {
          const payload = { id: workerForm.id, name: workerForm.name, role: workerForm.role, phone: workerForm.phone, skill_level: workerForm.skillLevel, monthly_capacity: Number(workerForm.monthlyCapacity || 75) };
          if (exists) await supabase.from('workers').update(payload).eq('id', workerForm.id);
          else await supabase.from('workers').insert([payload]);

          await supabase.from('worker_skills').delete().eq('worker_id', workerForm.id);
          if (workerForm.selectedProductIds.length > 0) {
            await supabase.from('worker_skills').insert(workerForm.selectedProductIds.map(pid => ({ worker_id: workerForm.id, product_id: pid })));
          }

          await supabase.from('worker_product_rates').delete().eq('worker_id', workerForm.id);
          const rateInserts = Object.entries(workerForm.customRatesMap)
            .filter(([pid, r]) => workerForm.selectedProductIds.includes(pid) && Number(r) > 0)
            .map(([pid, r]) => ({ worker_id: workerForm.id, product_id: pid, custom_rate: Number(r) }));
          if (rateInserts.length > 0) await supabase.from('worker_product_rates').insert(rateInserts);
        }

        const newWrk = { id: workerForm.id, name: workerForm.name, role: workerForm.role, phone: workerForm.phone, skillLevel: workerForm.skillLevel, monthlyCapacity: Number(workerForm.monthlyCapacity || 75) };
        if (exists) setWorkers(workers.map(w => w.id === workerForm.id ? newWrk : w));
        else setWorkers([...workers, newWrk]);

        const newSkills = workerSkills.filter(s => s.worker_id !== workerForm.id).concat(workerForm.selectedProductIds.map(pid => ({ worker_id: workerForm.id, product_id: pid })));
        setWorkerSkills(newSkills);

        const updatedRates = workerRates.filter(r => String(r.worker_id).trim() !== String(workerForm.id).trim());
        Object.entries(workerForm.customRatesMap).forEach(([pid, r]) => {
          if (workerForm.selectedProductIds.includes(pid) && Number(r) > 0) {
            updatedRates.push({ worker_id: String(workerForm.id).trim(), product_id: pid, custom_rate: Number(r) });
          }
        });
        setWorkerRates([...updatedRates]);

        setIsWorkerModalOpen(false);
      };

      const handleDeleteWorkerConfirm = (wrkId) => {
        const wrk = workers.find(w => w.id === wrkId);
        setDeleteWarning({
          isOpen: true,
          title: `Delete Worker "${wrk?.name}"?`,
          message: `Are you sure you want to delete ${wrk?.id}? This will remove all mapped skills and custom negotiated rates for this artisan.`,
          onConfirm: async () => {
            if (supabase) {
              await supabase.from('workers').delete().eq('id', wrkId);
            }
            setWorkers(workers.filter(w => w.id !== wrkId));
            setWorkerSkills(workerSkills.filter(s => s.product_id !== wrkId));
            setWorkerRates(workerRates.filter(r => r.worker_id !== wrkId));
            setDeleteWarning({ isOpen: false, title: '', message: '', onConfirm: null });
          }
        });
      };

      // WORK ORDER SELECTION & DYNAMIC FILTERING
      const getQualifiedWorkers = () => {
        if (!newTask.productId) return workers;
        const qualifiedIds = workerSkills.filter(s => s.product_id === newTask.productId).map(s => s.worker_id);
        return workers.filter(w => qualifiedIds.includes(w.id));
      };

      const handleModalProductChange = (prodId) => {
        const prod = products.find(p => p.id === prodId);
        const currentWorkerId = newTask.workerId;
        const customRateObj = workerRates.find(r => r.worker_id === currentWorkerId && r.product_id === prodId);
        const resolvedRate = customRateObj ? customRateObj.custom_rate : (prod ? prod.defaultRate : 150);
        const qualifiedWorkerIds = workerSkills.filter(s => s.product_id === prodId).map(s => s.worker_id);
        const newWorkerId = qualifiedWorkerIds.includes(currentWorkerId) ? currentWorkerId : (qualifiedWorkerIds[0] || workers[0]?.id);

        setNewTask({ ...newTask, productId: prodId, workerId: newWorkerId, ratePerPc: resolvedRate });
      };

      const handleModalWorkerChange = (wrkId) => {
        const prodId = newTask.productId;
        const customRateObj = workerRates.find(r => r.worker_id === wrkId && r.product_id === prodId);
        const prod = products.find(p => p.id === prodId);
        const resolvedRate = customRateObj ? customRateObj.custom_rate : (prod ? prod.defaultRate : 150);
        setNewTask({ ...newTask, workerId: wrkId, ratePerPc: resolvedRate });
      };

      // COMPUTE DYNAMIC TASK COMPLETED PIECES FROM BATCHES
      const getTaskCompletedPieces = (taskId) => {
        return taskProgressBatches
          .filter(b => String(b.task_id) === String(taskId))
          .reduce((sum, b) => sum + Number(b.pieces_completed || 0), 0);
      };

      // KPI Summaries
      const metrics = useMemo(() => {
        let totalPiecesTarget = 0, totalPiecesCompleted = 0, totalPayable = 0, totalPaid = 0;
        tasks.forEach(t => { 
          totalPiecesTarget += Number(t.piecesReceived || 0); 
          totalPiecesCompleted += getTaskCompletedPieces(t.id);
          totalPayable += Number(t.totalAmount || 0); 
          totalPaid += Number(t.paidAmount || 0); 
        });
        return { 
          totalPiecesTarget, 
          totalPiecesCompleted, 
          totalPayable, 
          totalPaid, 
          balanceOutstanding: totalPayable - totalPaid, 
          lowStockCount: inventory.filter(i => i.stock <= i.minAlert).length 
        };
      }, [tasks, taskProgressBatches, inventory]);

      const filteredTasks = useMemo(() => {
        return tasks.filter(t => {
          const matchesWorker = (currentUser && currentUser.role === 'Worker') 
            ? (t.workerName === workers.find(w => w.id === currentUser.worker_id)?.name)
            : (selectedWorker === 'All' || t.workerName === selectedWorker);

          const matchesStatus = selectedStatus === 'All' || t.status === selectedStatus;
          const matchesSearch = t.slipNo.toLowerCase().includes(searchTerm.toLowerCase()) || t.description.toLowerCase().includes(searchTerm.toLowerCase()) || t.workerName.toLowerCase().includes(searchTerm.toLowerCase());
          return matchesWorker && matchesStatus && matchesSearch;
        });
      }, [tasks, selectedWorker, selectedStatus, searchTerm, currentUser, workers]);

      const workerSummary = useMemo(() => {
        const summaryMap = {};
        workers.forEach(w => { 
          summaryMap[w.name] = { 
            id: w.id,
            name: w.name, 
            role: w.role || w.skillLevel, 
            monthlyCapacity: w.monthlyCapacity || 75,
            totalTasks: 0, 
            totalTargetPieces: 0,
            totalCompletedPieces: 0, 
            totalEarned: 0, 
            totalPaid: 0, 
            balance: 0, 
            materialConsumed: 0 
          }; 
        });
        tasks.forEach(t => {
          if (!summaryMap[t.workerName]) summaryMap[t.workerName] = { id: t.workerId, name: t.workerName, role: 'Artisan', monthlyCapacity: 75, totalTasks: 0, totalTargetPieces: 0, totalCompletedPieces: 0, totalEarned: 0, totalPaid: 0, balance: 0, materialConsumed: 0 };
          const w = summaryMap[t.workerName];
          w.totalTasks += 1;
          w.totalTargetPieces += Number(t.piecesReceived || 0);
          w.totalCompletedPieces += getTaskCompletedPieces(t.id);
          w.totalEarned += Number(t.totalAmount || 0);
          w.totalPaid += Number(t.paidAmount || 0);
          w.balance = w.totalEarned - w.totalPaid;
          if (t.subSlipMaterials) t.subSlipMaterials.forEach(m => { w.materialConsumed += Number(m.qty || 0); });
        });
        return Object.values(summaryMap);
      }, [workers, tasks, taskProgressBatches]);

      // Filtered Artisan Summary for Heatmap based on heatmapFilter
      const filteredWorkerSummary = useMemo(() => {
        if (heatmapFilter === 'All') return workerSummary;
        return workerSummary.filter(summary => {
          const capacity = summary.monthlyCapacity || 75;
          const loadPct = Math.min(100, Math.round((summary.totalTargetPieces / capacity) * 100));
          if (heatmapFilter === 'Free') return loadPct < 50;
          if (heatmapFilter === 'Loaded') return loadPct >= 50 && loadPct <= 85;
          if (heatmapFilter === 'Busy') return loadPct > 85;
          return true;
        });
      }, [workerSummary, heatmapFilter]);

      // Work-In-Progress (WIP) Analytics per Product Master Item
      const wipProductSummary = useMemo(() => {
        const wipMap = {};
        products.forEach(p => { wipMap[p.id] = { id: p.id, name: p.name, category: p.category, defaultRate: p.defaultRate, activeSlips: 0, totalTargetPieces: 0, totalCompletedPieces: 0, grossValue: 0 }; });
        tasks.forEach(t => {
          if (t.productId && wipMap[t.productId]) {
            wipMap[t.productId].activeSlips += 1;
            wipMap[t.productId].totalTargetPieces += Number(t.piecesReceived || 0);
            wipMap[t.productId].totalCompletedPieces += getTaskCompletedPieces(t.id);
            wipMap[t.productId].grossValue += Number(t.totalAmount || 0);
          }
        });
        return Object.values(wipMap);
      }, [products, tasks, taskProgressBatches]);

      // --- TIER 1: FUSE.JS LOCAL FUZZY SEARCH INSTANCES FOR MASTERS ---
      const workerFuse = useMemo(() => {
        if (!window.Fuse) return null;
        return new window.Fuse(workers, {
          keys: ['name', 'id', 'role', 'skillLevel'],
          threshold: 0.4,
          includeScore: true
        });
      }, [workers]);

      const productFuse = useMemo(() => {
        if (!window.Fuse) return null;
        return new window.Fuse(products, {
          keys: ['name', 'id', 'category', 'description'],
          threshold: 0.4,
          includeScore: true
        });
      }, [products]);

      const stockFuse = useMemo(() => {
        if (!window.Fuse) return null;
        return new window.Fuse(inventory, {
          keys: ['name', 'id', 'category'],
          threshold: 0.4,
          includeScore: true
        });
      }, [inventory]);

      // --- HYBRID LOCAL-FIRST FUZZY + LLM FALLBACK ROUTER ---
      const handleNlQuerySubmit = async (queryText) => {
        const q = (queryText || nlQuery).toLowerCase().trim();
        if (!q) return;

        let matchedResult = { text: '', type: 'info' };

        // TIER 1A: Quick Static Heuristic Shortcuts
        if (q.includes('busy') || q.includes('overloaded')) {
          setHeatmapFilter('Busy');
          if (currentUser?.role === 'Admin') setActiveTab('summary');
          matchedResult = { text: 'Local Router: Navigated to Analytics & filtered heatmap for Busy (>85%) artisans.', type: 'success' };
          setNlResponse(matchedResult);
          return;
        }
        if (q.includes('free') || q.includes('available')) {
          setHeatmapFilter('Free');
          if (currentUser?.role === 'Admin') setActiveTab('summary');
          matchedResult = { text: 'Local Router: Navigated to Analytics & filtered heatmap for Available (<50%) artisans.', type: 'success' };
          setNlResponse(matchedResult);
          return;
        }
        if (q.includes('pending') || q.includes('unpaid')) {
          setActiveTab('tasks');
          setSelectedStatus('Pending');
          if (currentUser?.role === 'Admin') setSelectedWorker('All');
          matchedResult = { text: 'Local Router: Filtered task ledger to show all Pending / Unpaid work orders.', type: 'success' };
          setNlResponse(matchedResult);
          return;
        }
        if (q.includes('low stock') || q.includes('alert')) {
          if (currentUser?.role === 'Admin') setActiveTab('inventory');
          matchedResult = { text: 'Local Router: Navigated to Raw Material Inventory showing stock alerts.', type: 'warning' };
          setNlResponse(matchedResult);
          return;
        }

        // TIER 1B: Fuse.js Local Fuzzy Matcher across Workers, Products, and Stock Masters
        if (workerFuse || productFuse || stockFuse) {
          const workerMatches = workerFuse ? workerFuse.search(q) : [];
          const productMatches = productFuse ? productFuse.search(q) : [];
          const stockMatches = stockFuse ? stockFuse.search(q) : [];

          // Rank top candidate across all 3 master collections
          let topCandidate = null;
          let bestScore = 1.0;

          if (workerMatches.length > 0 && workerMatches[0].score < bestScore) {
            bestScore = workerMatches[0].score;
            topCandidate = { type: 'worker', item: workerMatches[0].item };
          }
          if (productMatches.length > 0 && productMatches[0].score < bestScore) {
            bestScore = productMatches[0].score;
            topCandidate = { type: 'product', item: productMatches[0].item };
          }
          if (stockMatches.length > 0 && stockMatches[0].score < bestScore) {
            bestScore = stockMatches[0].score;
            topCandidate = { type: 'stock', item: stockMatches[0].item };
          }

          // If a high-confidence local fuzzy match was found (threshold < 0.38)
          if (topCandidate && bestScore < 0.38) {
            if (topCandidate.type === 'worker') {
              setActiveTab('tasks');
              if (currentUser?.role === 'Admin') setSelectedWorker(topCandidate.item.name);
              setSelectedStatus('All');
              matchedResult = {
                text: `Fuse.js Local Fuzzy Match [Worker Master]: Resolved query to "${topCandidate.item.name}" (${topCandidate.item.id}). Filtered task ledger.`,
                type: 'success'
              };
            } else if (topCandidate.type === 'product') {
              if (currentUser?.role === 'Admin') {
                setActiveTab('catalog');
                setMasterViewMode('grid');
              } else {
                setActiveTab('tasks');
              }
              setSearchTerm(topCandidate.item.name);
              matchedResult = {
                text: `Fuse.js Local Fuzzy Match [Product Master]: Resolved query to "${topCandidate.item.name}" (${topCandidate.item.id}).`,
                type: 'success'
              };
            } else if (topCandidate.type === 'stock') {
              if (currentUser?.role === 'Admin') setActiveTab('inventory');
              matchedResult = {
                text: `Fuse.js Local Fuzzy Match [Stock Master]: Resolved query to "${topCandidate.item.name}" (${topCandidate.item.id}) - Current Stock: ${topCandidate.item.stock} ${topCandidate.item.unit}.`,
                type: 'warning'
              };
            }
            setNlResponse(matchedResult);
            return;
          }
        }

        // TIER 2: LLM Fallback (With Full Masters Payload Context for Workers, Products & Stock)
        if (OPENAI_API_KEY && OPENAI_API_KEY !== 'YOUR_OPENAI_API_KEY_HERE') {
          setNlQuery('Analyzing query with AI...');
          try {
            const systemPrompt = `You are an AI assistant for Sahi Taj ERP, a Pagdi manufacturing portal. Users will type or speak in Hindi, English, or Hinglish (e.g. "Ramash kya kar rahe hai", "Kesaria pagdi ka kitna stock hai"), often with heavy typos or phonetic misspellings.

            You are provided with complete master data across all 3 domains:
            
            WORKERS MASTER:
            ${JSON.stringify(workers.map(w => ({ id: w.id, name: w.name, role: w.role, skillLevel: w.skillLevel, capacity: w.monthlyCapacity })))}

            PRODUCTS MASTER:
            ${JSON.stringify(products.map(p => ({ id: p.id, name: p.name, category: p.category, rate: p.defaultRate, mrp: p.mrp })))}

            RAW MATERIAL STOCK MASTER:
            ${JSON.stringify(inventory.map(i => ({ id: i.id, name: i.name, category: i.category, stock: i.stock, unit: i.unit, minAlert: i.minAlert })))}

            Note on Slip Numbers: Work order slip numbers follow a specific format (letters followed by numbers like A345, B208).

            Analyze the user's query and map it to the most relevant master item or action.
            Return ONLY a valid JSON object with this exact schema:
            {
              "intent": "view_worker_master" | "view_product_master" | "view_stock_master" | "get_slip_worker" | "get_available_workers" | "get_busy_workers" | "general_search",
              "matched_master": "worker" | "product" | "stock" | "none",
              "resolved_id": "string or null",
              "resolved_name": "string or null",
              "explanation": "short friendly description in English/Hinglish explaining which master item was identified and why"
            }`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${OPENAI_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: q }
                ],
                temperature: 0.1,
                response_format: { type: "json_object" }
              })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]?.message?.content) {
              const parsed = JSON.parse(data.choices[0].message.content);
              
              if (parsed.matched_master === 'worker' && parsed.resolved_name) {
                setActiveTab('tasks');
                if (currentUser?.role === 'Admin') setSelectedWorker(parsed.resolved_name);
                setSelectedStatus('All');
                matchedResult = {
                  text: `AI LLM Master Resolver [Worker Master]: Linked query to "${parsed.resolved_name}". ${parsed.explanation}`,
                  type: 'success'
                };
              } else if (parsed.matched_master === 'product' && parsed.resolved_name) {
                if (currentUser?.role === 'Admin') {
                  setActiveTab('catalog');
                } else {
                  setActiveTab('tasks');
                }
                setSearchTerm(parsed.resolved_name);
                matchedResult = {
                  text: `AI LLM Master Resolver [Product Master]: Linked query to product "${parsed.resolved_name}". ${parsed.explanation}`,
                  type: 'success'
                };
              } else if (parsed.matched_master === 'stock' && parsed.resolved_name) {
                if (currentUser?.role === 'Admin') setActiveTab('inventory');
                matchedResult = {
                  text: `AI LLM Master Resolver [Stock Master]: Linked query to raw material item "${parsed.resolved_name}". ${parsed.explanation}`,
                  type: 'warning'
                };
              } else if (parsed.intent === 'get_slip_worker' && parsed.resolved_name) {
                setActiveTab('tasks');
                setSearchTerm(parsed.resolved_name);
                matchedResult = {
                  text: `AI LLM Intent: Filtered task ledger for Slip "${parsed.resolved_name}". ${parsed.explanation}`,
                  type: 'success'
                };
              } else if (parsed.intent === 'get_available_workers') {
                setHeatmapFilter('Free');
                if (currentUser?.role === 'Admin') setActiveTab('summary');
                matchedResult = {
                  text: `AI LLM Intent: Filtered heatmap for available artisans. ${parsed.explanation || ''}`,
                  type: 'success'
                };
              } else if (parsed.intent === 'get_busy_workers') {
                setHeatmapFilter('Busy');
                if (currentUser?.role === 'Admin') setActiveTab('summary');
                matchedResult = {
                  text: `AI LLM Intent: Filtered heatmap for busy artisans. ${parsed.explanation || ''}`,
                  type: 'success'
                };
              } else {
                setActiveTab('tasks');
                setSearchTerm(q);
                matchedResult = {
                  text: `AI Assistant: ${parsed.explanation || `Searched catalog for "${q}".`}`,
                  type: 'success'
                };
              }
              setNlQuery(q);
              setNlResponse(matchedResult);
              return;
            }
          } catch (err) {
            console.error('LLM Assistant Error, falling back to search:', err);
          }
        }

        // Final General Fallback
        setActiveTab('tasks');
        setSearchTerm(q);
        matchedResult = { text: `Searched work orders and catalog for "${q}".`, type: 'success' };
        setNlResponse(matchedResult);
      };

      // Simulation Test Tools Handlers
      const handleSimulateRandomOrder = () => {
        if (workers.length === 0 || products.length === 0) {

        }
        const randomSlips = ['A199', 'B208', 'C401', 'X902'];
        const randomSlip = randomSlips[Math.floor(Math.random() * randomSlips.length)];
        const randomWorker = workers[Math.floor(Math.random() * workers.length)];
        const randomProd = products[Math.floor(Math.random() * products.length)];
        const randomPieces = Math.floor(Math.random() * 50) + 10;
        const total = randomPieces * randomProd.defaultRate;

        const simulatedTask = {
          id: `TSK-${Date.now()}`, slipNo: randomSlip, workerId: randomWorker.id, workerName: randomWorker.name, productId: randomProd.id, date: new Date().toISOString().split('T')[0],
          description: randomProd.name, piecesReceived: randomPieces, ratePerPc: randomProd.defaultRate, totalAmount: total, paidAmount: 0, status: 'Pending',

        setTasks([simulatedTask, ...tasks]);
        setNlResponse({ text: `Test tool injected simulated order Slip ${randomSlip} for ${randomWorker.name}!`, type: 'success' });

      const handleTriggerLowStock = () => {
        if (inventory.length === 0) {
          alert('Inventory is currently empty.');
          return;
        }
        setInventory(prev => prev.map((item, index) => {
          if (index === 0) return { ...item, stock: 10 };
          return item;
        }));
        if (currentUser?.role === 'Admin') setActiveTab('inventory');
        setNlResponse({ text: `Test tool forced ${inventory[0]?.name || 'Item'} stock down to 10 (Triggered Low Stock Alert).`, type: 'warning' });
      };

      // Material Sub-Slip Itemizer Handlers
      const handleAddSubSlipItem = () => {
        if (!currentMatInput.qty || Number(currentMatInput.qty) <= 0) return;
        const matObj = inventory.find(i => i.id === currentMatInput.materialId);
        if (!matObj) return;

        const unitLabel = currentMatInput.measureType === 'Length' ? 'Meters' : currentMatInput.measureType === 'Weight' ? 'Kg' : matObj.unit;
        setMaterialSubSlip([...materialSubSlip, { id: matObj.id, name: matObj.name, qty: Number(currentMatInput.qty), unit: unitLabel, type: currentMatInput.measureType }]);
        setCurrentMatInput({ ...currentMatInput, qty: '' });
      };

      const handleRemoveSubSlipItem = (index) => {
        setMaterialSubSlip(materialSubSlip.filter((_, i) => i !== index));
      };

      // Task Submission Handler
      const handleAddTaskSubmit = async (e) => {
        e.preventDefault();
        const pieces = Number(newTask.piecesReceived), rate = Number(newTask.ratePerPc), total = pieces * rate, paid = Number(newTask.paidAmount || 0);
        const prodObj = products.find(p => p.id === newTask.productId), wrkObj = workers.find(w => w.id === newTask.workerId);

        let updatedInventoryList = [...inventory];
        if (materialSubSlip.length > 0) {
          updatedInventoryList = inventory.map(item => {
            const matches = materialSubSlip.filter(m => m.id === item.id);
            if (matches.length > 0) return { ...item, stock: Math.max(0, item.stock - matches.reduce((a, c) => a + c.qty, 0)) };
            return item;
          });
          setInventory(updatedInventoryList);

          if (supabase) {
            for (const sub of materialSubSlip) {
              const currentItem = inventory.find(i => i.id === sub.id);
              const updatedStock = Math.max(0, (currentItem ? currentItem.stock : 0) - sub.qty);
              await supabase
                .from('inventory')
                .update({ stock: updatedStock })
                .eq('id', sub.id);
            }
          }
        }

        const createdTask = {
          id: `TSK-${Date.now()}`, slipNo: newTask.slipNo.toUpperCase(), workerId: newTask.workerId, workerName: wrkObj ? wrkObj.name : 'Unassigned',
          productId: newTask.productId, date: new Date().toISOString().split('T')[0], description: prodObj ? prodObj.name : 'Custom Order',
          piecesReceived: pieces, ratePerPc: rate, totalAmount: total, paidAmount: paid, status: paid >= total ? 'Paid' : paid > 0 ? 'Partial' : 'Pending',
          subSlipMaterials: materialSubSlip, materialAllocated: materialSubSlip.map(m => `${m.name} (${m.qty} ${m.unit})`).join(', '), notes: newTask.notes || 'Work order'
        };

        if (supabase) {
          await supabase.from('tasks').insert([{ id: createdTask.id, slip_no: createdTask.slipNo, worker_id: createdTask.workerId, worker_name: createdTask.workerName, product_id: createdTask.productId, date: createdTask.date, description: createdTask.description, pieces_received: createdTask.piecesReceived, rate_per_pc: createdTask.ratePerPc, total_amount: createdTask.totalAmount, paid_amount: createdTask.paidAmount, status: createdTask.status, sub_slip_materials: createdTask.subSlipMaterials, material_allocated: createdTask.materialAllocated, notes: createdTask.notes }]);
        }

        setTasks([createdTask, ...tasks]);
        setIsModalOpen(false);
        setMaterialSubSlip([]);
      };

      // Restock Handler
      const handleRestockSubmit = async (e) => {
        e.preventDefault();
        if (!restockData.addQty || Number(restockData.addQty) <= 0) return;
        const qtyToAdd = Number(restockData.addQty);
        const targetItem = inventory.find(i => i.id === restockData.materialId);
        const newStock = (targetItem ? targetItem.stock : 0) + qtyToAdd;

        if (supabase) {
          const { error } = await supabase
            .from('inventory')
            .update({ stock: newStock })
            .eq('id', restockData.materialId);
          if (error) {
            alert('Supabase Error updating stock: ' + error.message);
            return;
          }
        }

        setInventory(inventory.map(item => item.id === restockData.materialId ? { ...item, stock: newStock } : item));
        setIsRestockModalOpen(false);
        setRestockData({ materialId: inventory[0]?.id || '', addQty: '' });
      };

      // Open Progress Update Modal
      const handleOpenProgressModal = (task) => {
        setActiveTaskToUpdate(task);
        setProgressUpdateForm({ piecesChunk: '', newStatus: task.status === 'Pending' ? 'In Progress' : task.status, paidIncrement: '', notes: '' });
        setIsProgressModalOpen(true);
      };

      // Submit Work Chunk Progress Batch
      const handleProgressSubmit = async (e) => {
        e.preventDefault();
        if (!activeTaskToUpdate) return;

        const newChunkPieces = Number(progressUpdateForm.piecesChunk || 0);
        const incPaid = Number(progressUpdateForm.paidIncrement || 0);
        const newTotalPaid = Number(activeTaskToUpdate.paidAmount || 0) + incPaid;
        const finalStatus = progressUpdateForm.newStatus;

        const newBatchObj = {
          id: Date.now(),
          task_id: activeTaskToUpdate.id,
          pieces_completed: newChunkPieces,
          created_at: new Date().toISOString(),
          notes: progressUpdateForm.notes || 'Worker progress chunk'
        };

        if (supabase) {
          if (newChunkPieces > 0) {
            await supabase.from('task_progress_batches').insert([{
              task_id: activeTaskToUpdate.id,
              pieces_completed: newChunkPieces,
              notes: progressUpdateForm.notes || 'Worker progress chunk'
            }]);
          }

          await supabase.from('tasks').update({
            paid_amount: newTotalPaid,
            status: finalStatus,
            notes: progressUpdateForm.notes ? `${activeTaskToUpdate.notes || ''} | ${progressUpdateForm.notes}` : activeTaskToUpdate.notes
          }).eq('id', activeTaskToUpdate.id);
        }

        if (newChunkPieces > 0) {
          setTaskProgressBatches([...taskProgressBatches, newBatchObj]);
        }

        const updatedTask = {
          ...activeTaskToUpdate,
          paidAmount: newTotalPaid,
          status: finalStatus,
          notes: progressUpdateForm.notes ? `${activeTaskToUpdate.notes || ''} | ${progressUpdateForm.notes}` : activeTaskToUpdate.notes
        };

        setTasks(tasks.map(t => t.id === updatedTask.id ? updatedTask : t));
        setIsProgressModalOpen(false);
        setActiveTaskToUpdate(null);
      };

      // ADMIN EDIT SLIP: Open Edit Modal
      const handleOpenEditSlipModal = (task) => {
        setActiveTaskToEdit(task);
        setEditSlipForm({
          slipNo: task.slipNo,
          piecesReceived: task.piecesReceived,
          ratePerPc: task.ratePerPc,
          paidAmount: task.paidAmount,
          status: task.status,
          notes: task.notes || ''
        });
        setIsEditSlipModalOpen(true);
      };

      // ADMIN EDIT SLIP: Submit Edit
      const handleEditSlipSubmit = async (e) => {
        e.preventDefault();
        if (!activeTaskToEdit) return;

        const newPieces = Number(editSlipForm.piecesReceived);
        const newRate = Number(editSlipForm.ratePerPc);
        const newTotal = newPieces * newRate;
        const newPaid = Number(editSlipForm.paidAmount);
        const newStatus = editSlipForm.status;

        const updatedTask = {
          ...activeTaskToEdit,
          slipNo: editSlipForm.slipNo.toUpperCase(),
          piecesReceived: newPieces,
          ratePerPc: newRate,
          totalAmount: newTotal,
          paidAmount: newPaid,
          status: newStatus,
          notes: editSlipForm.notes
        };

        if (supabase) {
          await supabase.from('tasks').update({
            slip_no: updatedTask.slipNo,
            pieces_received: newPieces,
            rate_per_pc: newRate,
            total_amount: newTotal,
            paid_amount: newPaid,
            status: newStatus,
            notes: editSlipForm.notes
          }).eq('id', updatedTask.id);

      };

      // RENDER LOGIN SCREEN IF NOT AUTHENTICATED
      if (!currentUser) {

                <form onSubmit={handleProgressSubmit} className="space-y-4">
                  <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-xs space-y-1">
                    <div className="flex justify-between"><span>Original Order Size (Target):</span><strong className="text-amber-950">{activeTaskToUpdate.piecesReceived} pcs</strong></div>
                    <div className="flex justify-between"><span>Current Completed Pieces:</span><strong className="text-amber-900">{getTaskCompletedPieces(activeTaskToUpdate.id)} pcs</strong></div>
                    <div className="flex justify-between"><span>Current Status:</span><strong className="text-amber-900">{activeTaskToUpdate.status}</strong></div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Log Completed Work Chunk (Pieces Completed in this batch)</label>
                    <input
                      type="number"
                      min="0"
                      placeholder="e.g. 15"
                      value={progressUpdateForm.piecesChunk}
                      onChange={(e) => setProgressUpdateForm({ ...progressUpdateForm, piecesChunk: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm focus:ring-2 focus:ring-amber-500/40"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Update Status Progression *</label>
                    <select
                      value={progressUpdateForm.newStatus}
                      onChange={(e) => setProgressUpdateForm({ ...progressUpdateForm, newStatus: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm font-semibold"
                    >
                      <option value="Pending">Pending</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Partial">Partial</option>
                      <option value="Completed">Completed</option>
                      <option value="Paid">Paid</option>
                    </select>
                  </div>

                  {currentUser.role === 'Admin' && (
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Log Payout / Advance Payment (₹)</label>
                      <input
                        type="number"
                        min="0"
                        placeholder="e.g. 1000"
                        value={progressUpdateForm.paidIncrement}
                        onChange={(e) => setProgressUpdateForm({ ...progressUpdateForm, paidIncrement: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Chunk Notes / Remarks</label>
                    <textarea
                      rows="2"
                      value={progressUpdateForm.notes}
                      onChange={(e) => setProgressUpdateForm({ ...progressUpdateForm, notes: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm"
                      placeholder="Add batch notes..."
                    ></textarea>
                  </div>

                  <div className="mt-3 pt-3 border-t">
                    <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-2">Previous Chunk Logs for this Slip:</span>
                    <div className="space-y-1.5 max-h-28 overflow-y-auto pr-1">
                      {taskProgressBatches.filter(b => String(b.task_id) === String(activeTaskToUpdate.id)).map(b => (
                        <div key={b.id} className="bg-slate-50 p-2 rounded-lg border text-xs flex justify-between items-center">
                          <div>
                            <span className="font-bold text-amber-900">+{b.pieces_completed} pcs</span>
                            <span className="text-slate-400 text-[10px] ml-2">{b.notes || 'Batch'}</span>
                          </div>
                          <span className="text-[10px] text-slate-400">{new Date(b.created_at).toLocaleDateString()}</span>
                        </div>
                      ))}
                      {taskProgressBatches.filter(b => String(b.task_id) === String(activeTaskToUpdate.id)).length === 0 && (
                        <span className="text-xs text-slate-400 italic">No previous work chunks logged yet.</span>
                      )}
                    </div>
                  </div>

                  <div className="flex justify-end space-x-3 pt-3 border-t">
                    <button type="button" onClick={() => setIsProgressModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-600">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold bg-amber-600 text-white rounded-xl shadow">Log Chunk Entry</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADMIN EDIT SLIP MODAL */}
          {isEditSlipModalOpen && activeTaskToEdit && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border my-auto max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-3 border-b mb-4">
                  <h3 className="text-base font-bold text-slate-900">Edit Work Slip (Admin Audit)</h3>
                  <button onClick={() => setIsEditSlipModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <form onSubmit={handleEditSlipSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Slip No *</label>
                    <input
                      type="text"
                      required
                      value={editSlipForm.slipNo}
                      onChange={(e) => setEditSlipForm({ ...editSlipForm, slipNo: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Original Order Size *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={editSlipForm.piecesReceived}
                        onChange={(e) => setEditSlipForm({ ...editSlipForm, piecesReceived: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Rate / Pc (₹) *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={editSlipForm.ratePerPc}
                        onChange={(e) => setEditSlipForm({ ...editSlipForm, ratePerPc: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm font-bold text-amber-900"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Total Paid Amount (₹)</label>
                    <input
                      type="number"
                      min="0"
                      value={editSlipForm.paidAmount}
                      onChange={(e) => setEditSlipForm({ ...editSlipForm, paidAmount: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Status *</label>
                    <select
                      value={editSlipForm.status}
                      onChange={(e) => setEditSlipForm({ ...editSlipForm, status: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm"
                    >
                      <option value="Pending">Pending</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Partial">Partial</option>
                      <option value="Completed">Completed</option>
                      <option value="Paid">Paid</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Notes / Audit Remarks</label>
                    <textarea
                      rows="2"
                      value={editSlipForm.notes}
                      onChange={(e) => setEditSlipForm({ ...editSlipForm, notes: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm"
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-3 pt-3 border-t">
                    <button type="button" onClick={() => setIsEditSlipModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-600">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold bg-amber-600 text-white rounded-xl shadow">Save Slip Edits</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD WORK ORDER MODAL WITH MULTI-MATERIAL SUB-SLIP ITEMIZER */}
          {isModalOpen && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-xl w-full p-5 sm:p-6 shadow-2xl border my-auto max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-3 border-b sticky top-0 bg-white z-10">
                  <h3 className="text-base sm:text-lg font-bold text-slate-900">Issue Artisan Work Order Slip</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
                </div>

                <form onSubmit={handleAddTaskSubmit} className="mt-4 space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Slip No *</label>
                      <input type="text" required placeholder="e.g. A153" value={newTask.slipNo} onChange={(e) => setNewTask({ ...newTask, slipNo: e.target.value })} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">1. Select Pagadi Product *</label>
                      <select value={newTask.productId} onChange={(e) => handleModalProductChange(e.target.value)} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm">
                        {products.map(p => <option key={p.id} value={p.id}>{p.name} (Std: ₹{p.defaultRate})</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">2. Select Qualified Artisan (Filtered) *</label>
                    <select value={newTask.workerId} onChange={(e) => handleModalWorkerChange(e.target.value)} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm">
                      {getQualifiedWorkers().map(w => <option key={w.id} value={w.id}>{w.name} ({w.skillLevel})</option>)}
                    </select>
                  </div>

                  <div className="p-3 sm:p-4 bg-amber-50/60 rounded-xl border border-amber-200 space-y-3">
                    <span className="text-xs font-bold text-amber-900">Raw Material Issuance Sub-Slip</span>
                    <div className="grid grid-cols-1 sm:grid-cols-12 gap-2 items-end">
                      <div className="sm:col-span-5">
                        <select value={currentMatInput.materialId} onChange={(e) => setCurrentMatInput({ ...currentMatInput, materialId: e.target.value })} className="w-full px-2 py-1.5 bg-white rounded-lg border text-xs">
                          {inventory.map(inv => <option key={inv.id} value={inv.id}>{inv.name} (Stock: {inv.stock})</option>)}
                        </select>
                      </div>
                      <div className="sm:col-span-3">
                        <select value={currentMatInput.measureType} onChange={(e) => setCurrentMatInput({ ...currentMatInput, measureType: e.target.value })} className="w-full px-2 py-1.5 bg-white rounded-lg border text-xs">
                          <option value="Length">Length (Meters)</option>
                          <option value="Weight">Weight (Kg)</option>
                          <option value="Pieces">Count (Pcs)</option>
                        </select>
                      </div>
                      <div className="sm:col-span-2">
                        <input type="number" placeholder="Qty" value={currentMatInput.qty} onChange={(e) => setCurrentMatInput({ ...currentMatInput, qty: e.target.value })} className="w-full px-2 py-1.5 bg-white rounded-lg border text-xs" />
                      </div>
                      <div className="sm:col-span-2">
                        <button type="button" onClick={handleAddSubSlipItem} className="w-full py-1.5 bg-amber-700 text-white rounded-lg text-xs font-bold">+ Add</button>
                      </div>
                    </div>
                    {materialSubSlip.map((m, idx) => (
                      <div key={idx} className="flex justify-between bg-white p-2 rounded text-xs border border-amber-200">
                        <span>{m.name} ({m.type})</span>
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-amber-900">{m.qty} {m.unit}</span>
                          <button type="button" onClick={() => handleRemoveSubSlipItem(idx)} className="text-rose-500 font-bold">✕</button>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Pieces Ordered *</label>
                      <input type="number" min="1" required value={newTask.piecesReceived} onChange={(e) => setNewTask({ ...newTask, piecesReceived: e.target.value })} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Rate / Pc (₹) (Auto-filled) *</label>
                      <input type="number" min="1" required value={newTask.ratePerPc} onChange={(e) => setNewTask({ ...newTask, ratePerPc: e.target.value })} className="w-full px-3 py-2 bg-amber-50 border-amber-300 rounded-xl border text-sm font-bold text-amber-900" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Advance Paid (₹)</label>
                    <input type="number" min="0" value={newTask.paidAmount} onChange={(e) => setNewTask({ ...newTask, paidAmount: e.target.value })} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm" />
                  </div>

                  <div className="pt-4 flex justify-end space-x-3 border-t">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 text-sm text-slate-600">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-sm bg-amber-600 text-white rounded-xl font-semibold shadow">Confirm & Issue Slip</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RESTOCK MODAL */}
          {isRestockModalOpen && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border my-auto max-h-[85vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-slate-900 mb-4">Restock Raw Material Inventory</h3>
                <form onSubmit={handleRestockSubmit} className="space-y-4">
                  <select value={restockData.materialId} onChange={(e) => setRestockData({ ...restockData, materialId: e.target.value })} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm">
                    {inventory.map(item => <option key={item.id} value={item.id}>{item.name} (Current: {item.stock})</option>)}
                  </select>
                  <input type="number" min="1" required placeholder="Qty to add" value={restockData.addQty} onChange={(e) => setRestockData({ ...restockData, addQty: e.target.value })} className="w-full px-3 py-2 bg-slate-50 rounded-xl border text-sm" />
                  <div className="flex justify-end space-x-3 pt-2">
                    <button type="button" onClick={() => setIsRestockModalOpen(false)} className="px-4 py-2 text-sm">Cancel</button>
                    <button type="submit" className="px-4 py-2 text-sm bg-emerald-600 text-white rounded-xl">Add Stock</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* PRODUCT ADD/EDIT MODAL */}
          {isProductModalOpen && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 border shadow-2xl my-auto max-h-[85vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-slate-900 mb-4">{products.find(p => p.id === productForm.id) ? 'Edit Product Master' : 'Add New Product Master'}</h3>
                <form onSubmit={handleSaveProduct} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Product Code</label>
                    <input type="text" required value={productForm.id} onChange={e => setProductForm({ ...productForm, id: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Pagadi / Turban Name</label>
                    <input type="text" required value={productForm.name} onChange={e => setProductForm({ ...productForm, name: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Standard Rate (₹)</label>
                      <input type="number" required value={productForm.defaultRate} onChange={e => setProductForm({ ...productForm, defaultRate: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Retail MRP (₹)</label>
                      <input type="number" required value={productForm.mrp} onChange={e => setProductForm({ ...productForm, mrp: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Description</label>
                    <textarea value={productForm.description} onChange={e => setProductForm({ ...productForm, description: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" rows="2"></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsProductModalOpen(false)} className="px-4 py-2 text-sm">Cancel</button>
                    <button type="submit" className="px-4 py-2 text-sm bg-amber-600 text-white font-bold rounded-xl">Save Product</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* WORKER ADD/EDIT MODAL */}
          {isWorkerModalOpen && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 border shadow-2xl my-auto max-h-[85vh] overflow-y-auto">
                <h3 className="text-lg font-bold text-slate-900 mb-4">{workers.find(w => w.id === workerForm.id) ? 'Edit Worker & Custom Rates' : 'Register New Worker'}</h3>
                <form onSubmit={handleSaveWorker} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Worker ID</label>
                      <input type="text" required value={workerForm.id} onChange={e => setWorkerForm({ ...workerForm, id: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Worker Name</label>
                      <input type="text" required value={workerForm.name} onChange={e => setWorkerForm({ ...workerForm, name: e.target.value })} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Monthly Production Capacity (Pieces / Month) *</label>
                    <input type="number" min="1" required placeholder="Default: 75" value={workerForm.monthlyCapacity} onChange={e => setWorkerForm({ ...workerForm, monthlyCapacity: e.target.value })} className="w-full px-3 py-2 bg-amber-50 border border-amber-300 font-bold text-amber-900 rounded-xl text-sm" />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-2">Assign Skilled Products & Custom Negotiated Piece Rates (₹)</label>
                    <div className="space-y-2 max-h-48 overflow-y-auto p-2 bg-slate-50 rounded-xl border">
                      {products.map(p => {
                        const isChecked = workerForm.selectedProductIds.includes(p.id);
                        return (
                          <div key={p.id} className="flex items-center justify-between bg-white p-2 rounded border text-xs">
                            <label className="flex items-center space-x-2">
                              <input type="checkbox" checked={isChecked} onChange={e => {
                                const newPids = e.target.checked ? [...workerForm.selectedProductIds, p.id] : workerForm.selectedProductIds.filter(id => id !== p.id);
                                setWorkerForm({ ...workerForm, selectedProductIds: newPids });
                              }} />
                              <span className="font-semibold text-slate-800">{p.name} (Std: ₹{p.defaultRate})</span>
                            </label>
                            {isChecked && (
                              <input type="number" placeholder={`Std: ${p.defaultRate}`} value={workerForm.customRatesMap[p.id] || ''} onChange={e => {
                                setWorkerForm({ ...workerForm, customRatesMap: { ...workerForm.customRatesMap, [p.id]: e.target.value } });
                              }} className="w-24 px-2 py-1 bg-amber-50 border border-amber-300 font-bold text-amber-900 rounded" />
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setIsWorkerModalOpen(false)} className="px-4 py-2 text-sm">Cancel</button>
                    <button type="submit" className="px-4 py-2 text-sm bg-amber-600 text-white font-bold rounded-xl">Save Worker & Rates</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* WARNING CONFIRMATION POPUP MODAL */}
          {deleteWarning.isOpen && currentUser.role === 'Admin' && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 border shadow-2xl text-center">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-3 font-bold text-xl">⚠️</div>
                <h3 className="text-base font-bold text-slate-900">{deleteWarning.title}</h3>
                <p className="text-xs text-slate-500 mt-2">{deleteWarning.message}</p>
                <div className="flex justify-center space-x-3 mt-5">
                  <button onClick={() => setDeleteWarning({ isOpen: false, title: '', message: '', onConfirm: null })} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl">Cancel</button>
                  <button onClick={deleteWarning.onConfirm} className="px-4 py-2 text-xs font-bold text-white bg-rose-600 rounded-xl">Confirm Delete</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
